
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Mart - Login</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <main class="login-container">

        <section class="image-section">
            <img
                src="https://images.unsplash.com/photo-1626806787461-102c1bfaaea1?auto=format&fit=crop&w=900&q=85"
                alt="Laundry washing machine"
            >
        </section>

        <section class="form-section">
            <div class="login-form">

                <h1>Hello Again!</h1>
                <p class="subtitle">Welcome back! We missed you!</p>

                <form onsubmit="event.preventDefault(); alert('Demo login submitted!');">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Emailid@site.com"
                        required
                    >

                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        required
                    >

                    <a class="forgot" href="#forgot">Forgot Password</a>

                    <button type="submit">Login</button>
                </form>

                <p class="register">
                    Not a member?
                    <a href="#register">Register Now</a>
                </p>

            </div>
        </section>

    </main>

</body>
</html>
